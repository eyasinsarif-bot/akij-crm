<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKIJ CRM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="login-container">
    <div class="login-card">
      <div class="logo">A</div>
      <h1>AKIJ CRM</h1>
      <p class="subtitle">Sales Force Management System</p>
      <div id="login-error" class="alert alert-error" style="display:none"></div>
      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" placeholder="Enter username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
      </form>
      <div style="margin-top:16px;font-size:12px;color:var(--gray-400);text-align:center">
        Demo: admin / admin123
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <div class="app-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-small">A</div>
          <h2>AKIJ CRM</h2>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <div class="user-info">
            <div class="user-avatar" id="sidebar-avatar"></div>
            <div>
              <div style="font-weight:600;font-size:13px" id="sidebar-name"></div>
              <div style="font-size:11px;opacity:0.6" id="sidebar-role"></div>
            </div>
          </div>
          <button class="logout-btn" onclick="logout()">Sign Out</button>
        </div>
      </aside>

      <!-- MAIN -->
      <main class="main-content">
        <header class="page-header">
          <button class="back-btn" id="back-btn" onclick="goBack()">&#8592; Back</button>
          <h1 id="page-title">Dashboard</h1>
          <div style="flex:1"></div>
          <button class="btn btn-primary btn-sm" id="header-action-btn" style="display:none"></button>
        </header>
        <div class="content-area" id="content-area"></div>
      </main>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
